# {{ .Values.ui.prefix }}: a delegate of the root VirtualService (edge chart, route "postgres"): no hosts or gateways of
# its own. The allowlist (allowlist.yaml) runs on the gateway before any route.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: postgres-ui
  namespace: {{ .Release.Namespace }}
spec:
  http:
    # /postgres → /postgres/ (pgAdmin's links are under the folder).
    - name: postgres-slash
      match:
        - uri:
            exact: {{ .Values.ui.prefix }}
      redirect:
        uri: {{ printf "%s/" .Values.ui.prefix }}
        redirectCode: 302
    - name: postgres-ui
      match:
        - uri:
            prefix: {{ printf "%s/" .Values.ui.prefix }}
      headers:
        response:
          set:
            X-Robots-Tag: noindex, nofollow
            # pgAdmin frames its own pages (SAMEORIGIN) and sets its own Cache-Control (its JavaScript is large).
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
      route:
        - destination:
            host: {{ printf "postgres-ui.%s.svc.cluster.local" .Release.Namespace }}
            port:
              number: 80
