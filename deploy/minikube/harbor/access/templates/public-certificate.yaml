# The registry hostname's certificate for caSecretName in ../../values.yaml (the portal's CA download). Visitors get the
# Istio gateway's wildcard certificate. DNS-01, so it renews without any HTTP route.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-public
  namespace: {{ .Release.Namespace }}
spec:
  secretName: harbor-public-tls
  dnsNames: [{{ .Values.host | quote }}]
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
