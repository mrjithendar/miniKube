# Off-host backup to Cloudflare R2: README.md "Backup and restore". Suspended until harbor/harbor-backup-r2 exists;
# set backup.suspend false in ../values.yaml to enable it.
# The database is dumped before the blobs are copied, and blobs are only ever added in R2 (rclone copy, never sync),
# so every dump has all the blobs it references. Keep garbage collection out of this window (README.md).
# harbor-credentials is not uploaded: it is backed up separately, by hand, so one leak does not expose both.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor-backup
    app.kubernetes.io/part-of: harbor
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-backup
            app.kubernetes.io/part-of: harbor
        spec:
          restartPolicy: Never
          # The registry volume is local-path on one node; ReadWriteOnce allows a second pod on that same node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: {app: harbor, component: registry}
          automountServiceAccountToken: false
          initContainers:
          - name: dump
            image: postgres:18.6-alpine
            command: [sh, -c]
            args:
            # The shared PostgreSQL, straight to the primary (pg_dump needs a session of its own, not PgBouncer's).
            - pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Fc -f /work/registry.dump && pg_restore -l /work/registry.dump >/dev/null
            env:
            - name: PGHOST
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecret }}, key: direct-host}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecret }}, key: username}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecret }}, key: dbname}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecret }}, key: password}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
            - name: work
              mountPath: /work
          containers:
          - name: upload
            image: rclone/rclone:1.75.2
            command: [sh, -c]
            args:
            - |
              set -eu
              stamp="$(date -u +%Y%m%dT%H%M%SZ)"
              dest="r2:$R2_BUCKET/$R2_PREFIX"
              rclone copyto /work/registry.dump "$dest/postgres/registry-$stamp.dump"
              rclone copy /storage/docker "$dest/registry/docker" --transfers 4 --checkers 8 --stats-one-line --stats 60s
              # Written last: names the newest dump whose blobs are all in R2.
              echo "registry-$stamp.dump" | rclone rcat "$dest/LATEST"
              echo "backup $stamp complete"
            env:
            - name: R2_PREFIX
              value: backups/harbor
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef: {name: harbor-backup-r2, key: bucket}
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: RCLONE_CONFIG_R2_REGION
              value: auto
            - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
              value: 'true'
            - name: RCLONE_CONFIG_R2_ENDPOINT
              valueFrom:
                secretKeyRef: {name: harbor-backup-r2, key: endpoint}
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: harbor-backup-r2, key: access-key-id}
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: harbor-backup-r2, key: secret-access-key}
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: '1', memory: 512Mi}
            volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: registry-data
              mountPath: /storage
              readOnly: true
          volumes:
          - name: work
            emptyDir:
              sizeLimit: 2Gi
          - name: registry-data
            persistentVolumeClaim:
              claimName: harbor-registry
              readOnly: true
