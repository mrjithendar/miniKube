# Harbor on mk4: official chart harbor/harbor 1.19.4 (Harbor v2.15.4), release harbor in namespace harbor, installed by
# Terraform (minikube-infrastructure/harbor.tf) after ./access (release harbor-access: certificates, route, backup).
# Every key below was checked against that chart version's values.yaml and templates. README.md explains the choices.
#
# Portal https://registry.jithendar.com/harbor/; https://jithendar.com/harbor redirects there (edge routing table).
# Deployment prerequisites (README.md "Prerequisites"; harbor.tf refuses to plan without the two Secrets):
# - the registry hostname's DNS record and the private Docker Hub repository holding the arm64 Harbor images;
# - Secret harbor/harbor-credentials (./create-secrets.sh --services harbor --apply);
# - Secret harbor/dockerhub-pull (deploy-harbor.sh --skip-build creates it from a read-only Docker Hub token).
#
# To change the hostname, change externalURL here, host in access/values.yaml and deploy/minikube/istio/edge/values.yaml
# (gateway.https, the /harbor redirect).

externalURL: https://registry.jithendar.com

# The Istio gateway routes registry.jithendar.com straight to core and portal (manifests/harbor-virtualservice.yaml),
# the paths the chart's Ingress used. clusterIP renders no Ingress; its nginx proxy stays at 0 replicas (below), so
# the Service "harbor" it adds has no endpoints and nothing uses it. TLS terminates at the gateway.
expose:
  type: clusterIP
  tls:
    enabled: true
    # cert-manager issues it: manifests/harbor-public-certificate.yaml. Only the portal's CA download uses it now.
    certSource: secret
    secret:
      secretName: harbor-public-tls

# Backs the portal's "download registry certificate" link. Without it, certSource secret renders the core
# Deployment's ca-download volume with no source, which the API server rejects.
caSecretName: harbor-public-tls

# Official goharbor images are amd64-only and every mk4 node is arm64. deploy-harbor.sh builds these from the
# v2.15.4 source and pushes them to the private Docker Hub repository jithendar/custom-harbour, one tag per
# component (<component>-v2.15.4). Docker Hub stays reachable when Harbor is not (bootstrap, rebuilds).
# deploy-harbor.sh creates dockerhub-pull from your Docker Hub user and access token.
imagePullSecrets:
- name: dockerhub-pull

# One replica of everything. Each local-path volume keeps its pod on the worker that holds it.
updateStrategy:
  type: Recreate

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      storageClass: local-path
      accessMode: ReadWriteOnce
      # local-path does not enforce sizes: blobs share the worker's disk with every other volume and image there.
      # Retention and GC keep this bounded (README.md "Footprint").
      size: 30Gi
  imageChartStorage:
    type: filesystem
    # Filesystem storage has no redirects to disable; blobs are served by the registry itself.
    disableredirect: false
    filesystem:
      rootdirectory: /storage

# Credentials come from harbor/harbor-credentials (create_secrets.py): any value the chart would otherwise generate
# (randAlphaNum, genCA) would change on every upgrade.
existingSecretAdminPassword: harbor-credentials
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-credentials

internalTLS:
  enabled: false

ipFamily:
  ipv6:
    enabled: false

# The database is mk4's shared PostgreSQL (minikube-infrastructure/postgres.tf, tenant "registry": database and owner
# role registry, Secret postgres-db-credentials written into this namespace by Terraform); Redis is the shared Valkey
# (redis.tf, tenant "harbor": ACL user harbor, databases 2-5, Secret redis-harbor-credentials). The chart's internal
# database takes its password only from values, and its internal Redis has no password.
database:
  type: external
  external:
    # PgBouncer (session mode) in front of the current primary: one address across failovers.
    host: postgres-cluster-pooler-rw.postgres-db.svc.cluster.local
    port: '5432'
    username: registry
    coreDatabase: registry
    # Key "password".
    existingSecret: postgres-db-credentials
    # PgBouncer offers TLS (client_tls_sslmode prefer). postgres-db has no Istio sidecars, so this TLS is the only
    # encryption on the way.
    sslmode: require
  # Core and jobservice each keep a pool; together they stay under the role's connection_limit (50, postgres.tf).
  maxIdleConns: 10
  maxOpenConns: 20

redis:
  type: external
  external:
    # The current primary, through the HAProxy in every Valkey pod: one address across Sentinel failovers.
    addr: valkey-master.redis.svc.cluster.local:6379
    # ACL user "harbor" may SELECT only databases 2, 3, 4 and 5 (vars/mk4.tfvars redis_tenants).
    username: harbor
    coreDatabaseIndex: '2'
    jobserviceDatabaseIndex: '3'
    registryDatabaseIndex: '4'
    trivyAdapterIndex: '5'
    # Not existingSecret: the chart reads that with Helm lookup at render time, so a new password would reach
    # the URLs only on the next upgrade. Each component instead gets REDIS_PASSWORD from redis-harbor-credentials and
    # the URLs below are rebuilt with it ($(VAR) expansion; env takes precedence over the chart's envFrom ConfigMaps).
    password: ''

portal:
  image:
    repository: docker.io/jithendar/custom-harbour
    tag: harbor-portal-v2.15.4
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

core:
  image:
    repository: docker.io/jithendar/custom-harbour
    tag: harbor-core-v2.15.4
  replicas: 1
  # Key "secret".
  existingSecret: harbor-credentials
  existingXsrfSecret: harbor-credentials
  existingXsrfSecretKey: CSRF_KEY
  # Token-signing key pair, from cert-manager: manifests/harbor-token-certificate.yaml.
  secretName: harbor-token-tls
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 512Mi}
  extraEnvVars:
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: {name: redis-harbor-credentials, key: password}
  - name: _REDIS_URL_CORE
    value: redis://harbor:$(REDIS_PASSWORD)@valkey-master.redis.svc.cluster.local:6379/2?idle_timeout_seconds=30
  - name: _REDIS_URL_REG
    value: redis://harbor:$(REDIS_PASSWORD)@valkey-master.redis.svc.cluster.local:6379/4?idle_timeout_seconds=30

jobservice:
  image:
    repository: docker.io/jithendar/custom-harbour
    tag: harbor-jobservice-v2.15.4
  replicas: 1
  maxJobWorkers: 4
  # Job logs in PostgreSQL instead of a second PVC; they are swept after loggerSweeperDuration days.
  jobLoggers:
  - database
  loggerSweeperDuration: 14
  existingSecret: harbor-credentials
  existingSecretKey: JOBSERVICE_SECRET
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  extraEnvVars:
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: {name: redis-harbor-credentials, key: password}
  - name: _REDIS_URL_CORE
    value: redis://harbor:$(REDIS_PASSWORD)@valkey-master.redis.svc.cluster.local:6379/2?idle_timeout_seconds=30
  # Overrides redis_pool.redis_url in the chart's config.yml (src/jobservice/config/config.go: loadEnvs).
  - name: JOB_SERVICE_POOL_REDIS_URL
    value: redis://harbor:$(REDIS_PASSWORD)@valkey-master.redis.svc.cluster.local:6379/3

registry:
  replicas: 1
  # Hand the volume to the registry user once, as root with only CAP_CHOWN: hostPath-style volumes (local-path) ignore
  # the chart's fsGroup 10000.
  initContainers:
  - name: chown-storage
    image: busybox:1.37
    command: [chown, '10000:10000', /storage]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
        add: [CHOWN]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
    volumeMounts:
    - name: registry-data
      mountPath: /storage
  # Key REGISTRY_HTTP_SECRET.
  existingSecret: harbor-credentials
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    username: harbor_registry_user
    # Keys REGISTRY_PASSWD and REGISTRY_HTPASSWD.
    existingSecret: harbor-credentials
  relativeurls: false
  upload_purging:
    enabled: true
    age: 168h
    interval: 24h
    dryrun: false
  registry:
    image:
      repository: docker.io/jithendar/custom-harbour
      tag: registry-photon-v2.15.4
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: '1', memory: 1Gi}
    extraEnvVars:
    # Overrides redis.password in config.yml (distribution's REGISTRY_* environment overrides); the user is
    # redis.external.username above.
    - name: REGISTRY_REDIS_PASSWORD
      valueFrom:
        secretKeyRef: {name: redis-harbor-credentials, key: password}
  controller:
    image:
      repository: docker.io/jithendar/custom-harbour
      tag: harbor-registryctl-v2.15.4
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 256Mi}
    extraEnvVars:
    # Garbage collection runs here and reads the registry's config.yml, Redis section included.
    - name: REGISTRY_REDIS_PASSWORD
      valueFrom:
        secretKeyRef: {name: redis-harbor-credentials, key: password}

# Off by default to save memory (about 1 GiB with its vulnerability database). See README.md "Trivy".
trivy:
  enabled: false
  image:
    repository: docker.io/jithendar/custom-harbour
    tag: trivy-adapter-photon-v2.15.4
  replicas: 1
  skipUpdate: false
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: '1', memory: 1Gi}

# The exporter image hard-codes GOARCH=amd64 (make/photon/exporter/Dockerfile), so it cannot run here.
metrics:
  enabled: false

nginx:
  # expose.type clusterIP renders this proxy; the Istio gateway does its job (manifests/harbor-virtualservice.yaml).
  # No arm64 image of it is built (deploy-harbor.sh), so it must stay at 0.
  replicas: 0

cache:
  enabled: false
