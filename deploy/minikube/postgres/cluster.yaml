# PostgreSQL cluster "postgres-cluster" in namespace postgres-db (chart cnpg/cluster). Terraform: postgres.tf.
#
# The one PostgreSQL for every application on mk4 (replacing each application's own pod). One primary and one
# streaming replica, each on its own node (required anti-affinity) with a local-path volume pinned to that node. The
# operator fails over to the replica if the primary's pod or node goes. Services:
#   postgres-cluster-pooler-rw.postgres-db.svc:5432   PgBouncer in front of the primary: what applications use
#   postgres-cluster-rw.postgres-db.svc:5432          primary (reads and writes)
#   postgres-cluster-ro.postgres-db.svc:5432          replicas only
#   postgres-cluster-r.postgres-db.svc:5432           any instance
# Applications' databases, roles and credentials are not here: Terraform adds them from var.postgres_databases
# (postgres.tf: cluster.roles and databases are merged over this file). Bootstrap logins the operator writes:
# postgres-cluster-app (database "app", a scratch database no application uses), postgres-cluster-superuser.
# Public access: deploy/minikube/postgres/access (/postgres and postgres.jithendar.com).
type: postgresql
version:
  # Image ghcr.io/cloudnative-pg/postgresql:18 (multi-arch; mk4 is arm64). The major tag follows minor releases.
  postgresql: "18"
mode: standalone

cluster:
  # Primary + one replica on another worker (mk4 has three since 2026-11-11; podAntiAffinityType required: one
  # instance per node), so losing a node fails over instead of taking every application's database down. A third
  # instance needs memory on worker1/worker2, which are ~98% requested.
  instances: 2
  imagePullPolicy: Always
  storage:
    # Every application's data, once per instance. On 2026-11-09 the four application databases
    # together were about 0.4G. local-path does not enforce the size: all volumes share mk4's one disk (full on
    # 2026-11-08), so watch `df` on the host rather than this number.
    size: 10Gi
    storageClass: local-path
  affinity:
    # minikube nodes have no zone label: spread by node.
    topologyKey: kubernetes.io/hostname
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  # The operator's primary PDB blocks draining the primary's node until someone runs a switchover, which would stall
  # k3s upgrades (system-upgrade-controller drains). Failover covers an unplanned loss; drains just fail over too.
  enablePDB: false
  initdb:
    database: app
    owner: app
  postgresql:
    parameters:
      # Shared by every application: each role is also capped (connection_limit, postgres.tf). PgBouncer keeps the
      # number of server connections well below this.
      max_connections: "300"
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      # One slow query or forgotten transaction must not hold locks for every other application.
      idle_in_transaction_session_timeout: "600000"
      # Setting a pg_stat_statements parameter makes CloudNativePG preload the library; `CREATE EXTENSION
      # pg_stat_statements` in a database to see which application's queries cost the most.
      pg_stat_statements.track: top
      # Reached through the Istio gateway: log who connects.
      log_connections: "on"
      log_disconnections: "on"
  # The exporter on :9187 always runs; Prometheus scrapes it through the headless Service postgres-cluster-metrics
  # (access chart). "enabled" would only create a PodMonitor, which mk4 has no CRD for.
  monitoring:
    enabled: false

# PgBouncer in front of the primary, session mode: every client feature works (prepared statements, advisory locks,
# SET, LISTEN), unlike transaction mode. It caps and reuses server connections and survives a failover without
# applications changing host. Its own login (cnpg_pooler_pgbouncer, client certificate) is managed by the operator.
poolers:
  - name: rw
    type: rw
    poolMode: session
    instances: 2
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
    template:
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      cnpg.io/poolerName: postgres-cluster-pooler-rw
        containers:
          - name: pgbouncer
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 256Mi

# Base backups and the WAL archive in a private Cloudflare R2 bucket (point-in-time restore inside the retention window).
# Off here; Terraform turns it on and fills in the endpoint and bucket when var.postgres_backups is set (postgres.tf),
# and refuses to unless the credentials Secret exists (scripts/postgres/backup-secret.sh). A replica is not a backup.
backups:
  enabled: false
  # Through the Barman Cloud plugin (release barman-cloud, postgres.tf): the operator's built-in barmanObjectStore is
  # removed in CloudNativePG 1.31. The chart renders the plugin's ObjectStore postgres-cluster-backups from this block.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  objectStore:
    create: true
    # Terraform's helm_release applies hooks like any other object, before the Cluster that needs it.
    helmHook: true
  # The replica takes the base backups, so the primary does not pay for them.
  target: prefer-standby
  provider: s3
  s3:
    path: /postgres-cluster
  secret:
    # Created by scripts/postgres/backup-secret.sh, never by this chart: the keys stay out of Helm and Terraform state.
    create: false
    name: postgres-backup-r2
  wal:
    compression: gzip
    # R2 encrypts every object at rest and does not take the SSE-S3 header (AES256), which barman would send.
    encryption: ""
    maxParallel: 2
  data:
    compression: gzip
    encryption: ""
    jobs: 2
  scheduledBackups:
    - name: daily
      # Six-field cron (seconds first): 02:00 UTC, 07:30 in India, the quietest hour.
      schedule: "0 0 2 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "14d"
