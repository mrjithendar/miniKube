# https://jfrog.jithendar.com on the Istio gateway (miniKube deploy/minikube/istio/edge: Gateway public, wildcard
# certificate, HTTP only redirects; jithendar.com/jfrog redirects to /ui/ here). Artifactory's own nginx does the rest.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: jfrog
  namespace: jfrog
spec:
  hosts: [jfrog.jithendar.com]
  gateways: [istio-ingress/public]
  http:
  - name: artifactory
    route:
    - destination:
        host: jfrog-artifactory-nginx.jfrog.svc.cluster.local
        port: {number: 80}
