# The Argo CD chart's NetworkPolicies isolate ingress for its pods. Prometheus (namespace monitoring) also needs the
# sidecar's ports there, or Kiali gets no traffic for argocd: 15020 merged metrics and health, 15090 Envoy's own
# (job envoy-stats). Nothing here is egress-isolated, so the sidecars already reach DNS and istiod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-sidecars
  namespace: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 15020, protocol: TCP}
        - {port: 15090, protocol: TCP}
