# Values for istio-release gateway 1.30.7 (minikube-infrastructure/istio.tf): the Istio ingress gateway on mk4.
# Release name istio-ingressgateway gives the pods the label istio=ingressgateway, the selector Gateway resources use.
# mk4's public edge (k3s on Hetzner Cloud). The Hetzner cloud controller turns this Service into load balancer
# "mk4-edge" (LB11) that sends 80/443 to the nodes with a PROXY protocol header, which the gateway reads (edge/,
# EnvoyFilter proxy-protocol); routing, logins and the certificate are in edge/ and in the applications'
# VirtualServices. jithendar.com and *.jithendar.com point at the load balancer's public IPv4.
service:
  type: LoadBalancer
  annotations:
    load-balancer.hetzner.cloud/name: mk4-edge
    load-balancer.hetzner.cloud/type: lb11
    load-balancer.hetzner.cloud/location: fsn1
    # Targets the nodes on the private network (10.0.0.0/16), not their public IPs.
    load-balancer.hetzner.cloud/use-private-ip: "true"
    load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
    load-balancer.hetzner.cloud/disable-private-ingress: "true"
    load-balancer.hetzner.cloud/ipv6-disabled: "false"
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 31443
# No gatewayTopology.numTrustedProxies: nothing in front sets X-Forwarded-For any more (HAProxy forwards TCP), and the
# client address comes from the PROXY protocol. Trusting a hop would let visitors choose their own address.
# Two replicas on different nodes and a PodDisruptionBudget: the gateway is mk4's only way in, so a node drain or a
# rollout must never take the last one. No HPA: small cluster, and metrics-server load should not decide gateway count.
autoscaling:
  enabled: false
replicaCount: 2
podDisruptionBudget:
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {istio: ingressgateway}
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
