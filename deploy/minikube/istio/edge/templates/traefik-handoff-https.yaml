{{- with .Values.traefikHandoff }}
{{- if .enabled }}
{{- $match := list }}
{{- range .hosts }}{{ $match = append $match (printf "Host(`%s`)" .) }}{{ end }}
# Temporary, while Traefik runs (Terraform traefik_enabled): whatever these hosts have no Traefik route for any more
# goes to the gateway. Gone with Traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: istio-handoff-https
  namespace: {{ $.Release.Namespace | quote }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: {{ join " || " $match | quote }}
      # Lowest priority: Ingresses for other paths on these hosts and cert-manager's HTTP-01 solvers keep precedence.
      priority: 1
      services:
        - name: istio-ingressgateway
          port: 443
          scheme: https
          serversTransport: istio-ingressgateway
  # Traefik's default certificate (TLSStore default, jithendar.com repo), which covers these hosts.
  tls: {}
{{- end }}
{{- end }}
