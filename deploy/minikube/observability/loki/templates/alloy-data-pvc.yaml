apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # terraform destroy and helm uninstall leave the volume and its data.
    helm.sh/resource-policy: keep
  name: alloy-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  # Node-local disk (local-path-provisioner); the PV pins the pod to the node that holds it.
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
