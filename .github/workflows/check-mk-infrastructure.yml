name: Check minikube infrastructure

# Runs on GitHub-hosted runners with no cluster or AWS access: this repository is public, so pull request code
# never gets the mk4 token or the state role (both live in the "mk4" environment, master only).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'minikube-infrastructure/**'
      - 'deploy/minikube/cert-manager/**'
      - 'deploy/minikube/metrics-server/values.yaml'
      - 'deploy/minikube/gatekeeper/**'
      - 'deploy/minikube/istio/**'
      - 'deploy/minikube/observability/**'
      - 'deploy/minikube/storage/**'
      - 'deploy/minikube/postgres/**'
      - 'deploy/minikube/argocd/**'
      - 'deploy/minikube/harbor/values.yaml'
      - 'deploy/minikube/harbor/access/**'
      - '.github/mk4-terraform-kubeconfig.yaml'
      - '.github/workflows/*-mk-infrastructure.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: miniKube

    steps:
      # miniKube and jithendar.com side by side, as on a workstation: grafana.tf reads ../jithendar.com/grafana.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: miniKube
          persist-credentials: false

      # jithendar.com is private: GITHUB_TOKEN only reaches this repository. Read-only deploy key on jithendar.com.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mrjithendar/jithendar.com
          ref: master
          path: jithendar.com
          ssh-key: ${{ secrets.JITHENDAR_COM_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: services/grafana

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform format check
        run: terraform -chdir=minikube-infrastructure fmt -check -recursive

      - name: terraform init & validate
        run: |
          terraform -chdir=minikube-infrastructure init -backend=false -input=false -no-color
          terraform -chdir=minikube-infrastructure validate -no-color

      # Mock providers only; see minikube-infrastructure/tests.
      - name: terraform test
        run: terraform -chdir=minikube-infrastructure test -no-color -var-file=vars/mk4.tfvars

      # Local charts must render. Helm is preinstalled on GitHub's Ubuntu images.
      - name: helm lint & template (local charts)
        run: |
          set -euo pipefail
          # The edge chart refuses to render without a login per basicAuth entry (Terraform passes the real ones from
          # Secrets on mk4); give it placeholders derived from its own list so a new entry cannot break this check.
          names=$(sed -nE '/^basicAuth:/,/^[^ -]/s/^  - \{name: ([a-z0-9-]+),.*/\1/p' deploy/minikube/istio/edge/values.yaml)
          [[ -n "$names" ]] || { echo "::error::no basicAuth names found in deploy/minikube/istio/edge/values.yaml"; exit 1; }
          { echo 'basicAuthUsers:'; for n in $names; do echo "  $n: \"ci:{SHA}AAAAAAAAAAAAAAAAAAAAAAAAAAA=\""; done; } > "$RUNNER_TEMP/edge-ci.yaml"
          helm lint deploy/minikube/istio/edge -f "$RUNNER_TEMP/edge-ci.yaml"
          helm template check deploy/minikube/istio/edge -f "$RUNNER_TEMP/edge-ci.yaml" > /dev/null
          for chart in cert-manager/issuers gatekeeper/library gatekeeper/constraints harbor/access observability/prometheus observability/loki observability/jaeger \
                       observability/otel-collector observability/grafana/dashboards; do
            helm lint "deploy/minikube/$chart"
            helm template check "deploy/minikube/$chart" > /dev/null
          done
          helm lint deploy/minikube/storage/local-path-provisioner -f deploy/minikube/storage/local-path.yaml
          helm template check deploy/minikube/storage/local-path-provisioner -f deploy/minikube/storage/local-path.yaml > /dev/null
          # Refuses to render without an allowlist (it would otherwise lock everyone out or let everyone in).
          helm lint deploy/minikube/postgres/access --set 'allowedIps[0]=192.0.2.1/32'
          helm template check deploy/minikube/postgres/access --set 'allowedIps[0]=192.0.2.1/32' > /dev/null
