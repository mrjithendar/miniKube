# pgAdmin 4 (dpage/pgadmin4) at https://jithendar.com{{ .Values.ui.prefix }}/. Two logins:
#   1. pgAdmin itself: email and password from Secret {{ .Values.ui.adminSecret }} in this namespace (Terraform,
#      postgres.tf): kubectl --context mk4 -n {{ .Release.Namespace }} get secret {{ .Values.ui.adminSecret }} -o jsonpath='{.data.password}' | base64 -d
#   2. the database: server "{{ .Values.cluster }}" is pre-registered (ui-servers-configmap.yaml) with user postgres; open
#      it with {{ .Values.cluster }}-superuser's password, or edit its Connection tab to an application's login
#      (Secret db-<name>, database <name>).
# SCRIPT_NAME serves it under the prefix (gunicorn strips it), so its cookies are scoped there too. Its NetworkPolicy
# lets it reach only this cluster. Settings, saved servers and query history live on the postgres-ui-data volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-ui
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must let go of it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-ui
  template:
    metadata:
      labels:
        app: postgres-ui
      annotations:
        checksum/servers: {{ include (print $.Template.BasePath "/ui-servers-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The image's pgadmin user.
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          image: {{ .Values.ui.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.adminSecret }}
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.adminSecret }}
                  key: password
            - name: SCRIPT_NAME
              value: {{ .Values.ui.prefix | quote }}
            # Non-root: no port 80.
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            # Read on first start only (when pgAdmin creates its database); later edits in the UI are kept.
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            # No mail relay here (and postfix would need root).
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            # PGADMIN_CONFIG_* are Python expressions merged into pgAdmin's config.
            # Ties the session to the client address, which is whichever ingress gateway pod forwarded the request:
            # sessions would drop at random.
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "False"
            - name: PGADMIN_CONFIG_SESSION_COOKIE_SECURE
              value: "True"
            # TLS ends at the gateway; trust its X-Forwarded-Proto so redirects stay https.
            - name: PGADMIN_CONFIG_PROXY_X_PROTO_COUNT
              value: "1"
            # Its egress is limited to this cluster.
            - name: PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED
              value: "False"
            # Default 3 locks the account (unlocking needs the pod's setup.py); the gateway allowlist already limits
            # who can try.
            - name: PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS
              value: "10"
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: {{ printf "%s/misc/ping" .Values.ui.prefix }}
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: {{ printf "%s/misc/ping" .Values.ui.prefix }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ printf "%s/misc/ping" .Values.ui.prefix }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # The image's python carries this file capability; exec fails if it is outside the bounding set.
              add: [NET_BIND_SERVICE]
            # The entrypoint writes /pgadmin4/config_distro.py.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-ui-data
        - name: servers
          configMap:
            name: postgres-ui-servers
