# Values for istio-release gateway 1.30.7 (minikube-infrastructure/istio.tf): the Istio ingress gateway on mk4.
# Release name istio-ingressgateway gives the pods the label istio=ingressgateway, the selector Gateway resources use.
# Traefik stays the public edge (NodePorts 30080/30443, forwarded from the host). This gateway gets its own NodePorts
# 31080/31443, reachable only inside the host's network until something forwards to them or Traefik routes to the
# Service istio-ingress/istio-ingressgateway.
service:
  # Minikube has no load balancer: a LoadBalancer Service would stay <pending> and helm --wait would time out.
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 31443
# One replica, no HPA: small cluster, and metrics-server load should not decide gateway count.
autoscaling:
  enabled: false
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
