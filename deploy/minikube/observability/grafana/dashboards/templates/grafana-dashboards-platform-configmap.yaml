# Grafana folder Platform: the shared clusters every application uses (PostgreSQL in postgres-db, Valkey in redis).
# JSON at the chart root, loaded verbatim (never templated).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-platform
  namespace: monitoring
data:
  {{- range $path, $_ := .Files.Glob "platform-*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
