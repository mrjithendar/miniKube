name: Create minikube infrastructure

# Applies minikube-infrastructure/ (Helm releases on mk4: metrics-server, cert-manager, Let's Encrypt, Istio (+ CNI, ingress gateway), Kiali,
# Prometheus, Grafana, Loki, OpenTelemetry Collector, Jaeger, local-path storage, CloudNativePG + PostgreSQL) on pushes to master, or by hand with "plan only" to see
# drift. Pull requests are checked by check-mk-infrastructure.yml.
# Off until repository variable MINIKUBE_TERRAFORM_APPLY is "true": set it after the one-time move of the live add-ons
# off Argo CD (minikube-infrastructure/README.md), never before.
#
# Access, all set by scripts/setup-minikube-terraform-ci.sh:
#   mk4    ServiceAccount kube-system/github-minikube-terraform; kubeconfig template .github/mk4-terraform-kubeconfig.yaml
#          filled from MK4_API_SERVER, MK4_CA_DATA (variables) and MK4_TERRAFORM_TOKEN (secret of environment mk4).
#   state  AWS role MK4_TERRAFORM_ROLE_ARN through GitHub OIDC (tools repository: infrastructure/github-minikube-terraform.tf):
#          the S3 state object and its lock, nothing else.
# Runs on GitHub-hosted runners, never on the mk4 server (tools repository: runner/README.md).
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: Plan without applying
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'minikube-infrastructure/**'
      - 'deploy/minikube/cert-manager/**'
      - 'deploy/minikube/metrics-server/values.yaml'
      - 'deploy/minikube/istio/**'
      - 'deploy/minikube/observability/**'
      - 'deploy/minikube/storage/**'
      - 'deploy/minikube/postgres/**'
      - 'deploy/minikube/argocd/**'
      - 'deploy/minikube/harbor/values.yaml'
      - 'deploy/minikube/harbor/access/**'
      - '.github/mk4-terraform-kubeconfig.yaml'
      - '.github/workflows/create-mk-infrastructure.yml'

permissions:
  contents: read

# Never cancel an active apply: Helm would leave a release pending.
concurrency:
  group: terraform-minikube-mk4
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/master' && vars.MINIKUBE_TERRAFORM_APPLY == 'true'
    runs-on: ubuntu-latest
    environment: mk4
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: miniKube
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      # Harbor's pull Secret for its private arm64 images (minikube-infrastructure/harbor.tf).
      TF_VAR_dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
      TF_VAR_dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      # miniKube and jithendar.com side by side, as on a workstation: grafana.tf reads ../jithendar.com/grafana.
      # A dashboard change in jithendar.com does not trigger this workflow; run it by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: miniKube
          persist-credentials: false

      # jithendar.com is private: GITHUB_TOKEN only reaches this repository. Read-only deploy key on jithendar.com.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mrjithendar/jithendar.com
          ref: master
          path: jithendar.com
          ssh-key: ${{ secrets.JITHENDAR_COM_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: services/grafana

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # Without the role ARN, configure-aws-credentials falls back to static keys and retries 12 times with
      # "Could not load credentials from any providers".
      - name: Check CI settings
        env:
          MK4_TERRAFORM_ROLE_ARN: ${{ vars.MK4_TERRAFORM_ROLE_ARN }}
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_TERRAFORM_TOKEN: ${{ secrets.MK4_TERRAFORM_TOKEN }}
        run: |
          missing=()
          for v in MK4_TERRAFORM_ROLE_ARN MK4_API_SERVER MK4_CA_DATA MK4_TERRAFORM_TOKEN TF_VAR_dockerhub_username TF_VAR_dockerhub_password; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          [[ ${#missing[@]} -eq 0 ]] || { echo "::error::Not set: ${missing[*]}. Run scripts/setup-minikube-terraform-ci.sh (TF_VAR_dockerhub_*: repository secrets DOCKER_USERNAME, DOCKER_PASSWORD)"; exit 1; }

      - name: AWS credentials (state only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MK4_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Kubeconfig for mk4
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_TERRAFORM_TOKEN: ${{ secrets.MK4_TERRAFORM_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_TERRAFORM_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-minikube-terraform-ci.sh"; exit 1; }
          done
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' .github/mk4-terraform-kubeconfig.yaml > "$RUNNER_TEMP/kubeconfig")
          echo "TF_VAR_kubeconfig_path=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          # Fail here, not mid-plan: the later kubectl checks hide errors, so an old MK4_API_SERVER (e.g. the deleted
          # Minikube's jithendar.com:32771) only surfaced as "connection refused" inside terraform apply.
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl --request-timeout=20s get --raw /version >/dev/null \
            || { echo "::error::mk4 API $MK4_API_SERVER unreachable or rejected the token; re-run scripts/setup-minikube-terraform-ci.sh against the current cluster"; exit 1; }

      # The DNS-01 issuers need it; without it the wildcard Certificate never becomes Ready (README.md).
      - name: Check prerequisites on mk4
        run: |
          set -euo pipefail
          left=$(kubectl --request-timeout=20s -n argocd get applications -o name 2>/dev/null \
            | grep -E '/(metrics-server|grafana|prometheus|loki|otel-collector|jaeger|cert-manager)$' || true)
          [[ -z "$left" ]] || { echo "::error::Argo CD still owns: $left (minikube-infrastructure/README.md steps 1-4)"; exit 1; }
          kubectl --request-timeout=20s -n cert-manager get secret cloudflare-api-token -o name \
            || echo "::warning::Secret cert-manager/cloudflare-api-token missing: the wildcard certificate will stay pending"

      - name: terraform format check
        run: terraform -chdir=minikube-infrastructure fmt -check -recursive

      - name: terraform init & validate
        run: |
          terraform -chdir=minikube-infrastructure init -input=false -no-color
          terraform -chdir=minikube-infrastructure validate -no-color

      - name: terraform test
        run: terraform -chdir=minikube-infrastructure test -no-color -var-file=vars/mk4.tfvars

      # A plan of helm_release.postgres_cluster dry-runs its Cluster/Database objects and fails with
      # 'no matches for kind "Cluster"' until the CloudNativePG CRDs exist (README.md, "First install, in stages").
      # Install the operator (and the local-path class its volumes use) on its own first.
      # Also create namespace postgres-db up front (the release lives there). It was needed while experiments.manifest
      # was on (removed 2026-11-09: "Provider produced inconsistent result" for objects in new namespaces); kept as a
      # harmless ordering step. A no-op once the CRD and the namespace exist.
      - name: Bootstrap CloudNativePG CRDs
        if: ${{ !inputs.plan_only }}
        run: |
          set -euo pipefail
          if kubectl --request-timeout=20s get crd clusters.postgresql.cnpg.io -o name >/dev/null 2>&1 \
             && kubectl --request-timeout=20s get namespace postgres-db -o name >/dev/null 2>&1; then
            echo "CloudNativePG CRDs and namespace postgres-db present"; exit 0
          fi
          echo "::notice::CloudNativePG CRDs or namespace postgres-db missing: applying them first"
          scripts/lib/retry-chart-fetch.sh -- \
            terraform -chdir=minikube-infrastructure apply -input=false -no-color -auto-approve -lock-timeout=5m \
            -var-file=vars/mk4.tfvars -target=helm_release.local_path_provisioner -target=helm_release.cnpg_operator \
            -target=kubernetes_namespace_v1.postgres_db
          kubectl --request-timeout=20s wait --for=condition=Established --timeout=120s \
            crd/clusters.postgresql.cnpg.io crd/databases.postgresql.cnpg.io crd/poolers.postgresql.cnpg.io

      # Remote charts are downloaded while planning and again while applying; a 5xx or timeout from a chart host
      # (e.g. 504 from github.com release downloads for the CloudNativePG cluster chart) is retried with backoff by
      # scripts/lib/retry-chart-fetch.sh. Other failures are not retried.
      - name: terraform plan
        run: |
          set -euo pipefail
          umask 077
          scripts/lib/retry-chart-fetch.sh -- terraform -chdir=minikube-infrastructure plan -input=false -no-color -lock-timeout=5m \
            -var-file=vars/mk4.tfvars -out=tf.tfplan | tee "$RUNNER_TEMP/plan.txt"
          { echo '### terraform plan'; echo '```'; grep -E '^  # |^Plan:|^No changes' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: ${{ !inputs.plan_only }}
        # A retry re-plans first: after a partial apply the saved plan is stale and Terraform refuses it.
        run: |
          set -euo pipefail
          umask 077
          scripts/lib/retry-chart-fetch.sh -- bash -c '
            set -euo pipefail
            if [[ -e "$1" ]]; then
              terraform -chdir=minikube-infrastructure plan -input=false -no-color -lock-timeout=5m \
                -var-file=vars/mk4.tfvars -out=tf.tfplan
            fi
            touch "$1"
            terraform -chdir=minikube-infrastructure apply -input=false -no-color -lock-timeout=5m tf.tfplan
          ' _ "$RUNNER_TEMP/apply-attempted"

      - name: Verify releases
        if: ${{ !inputs.plan_only }}
        run: |
          set -euo pipefail
          # Only this root's releases.
          releases='^(metrics-server|cert-manager|letsencrypt-jithendar|istio-base|istio-cni|istiod|istio-ingressgateway|istio-edge|istio-mesh|kiali|prometheus|grafana-dashboards|grafana|loki|otel-collector|jaeger|local-path-provisioner|cnpg|barman-cloud|postgres-cluster|postgres-access|argocd|harbor-access|harbor)$'
          { echo '### Helm releases'; echo '```'; helm list -A --kube-context mk4 --filter "$releases"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          expected=24
          deployed=$(helm list -A --kube-context mk4 --filter "$releases" --deployed -q | wc -l)
          [[ "$deployed" -eq "$expected" ]] || { echo "::error::$deployed of $expected releases deployed"; helm list -A --kube-context mk4 --filter "$releases"; exit 1; }
          # A freshly started pod (Kiali warms its caches) and a new route answer 503 for a while: retry for 3 min.
          # Behind Cloudflare Access these answer 302 (to the Access login) or 403: the route is still up.
          for path in grafana/api/health prometheus/-/ready kiali/; do
            for attempt in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://jithendar.com/$path" || true)
              [[ "$code" =~ ^(200|302|401|403)$ ]] && break
              echo "https://jithendar.com/$path -> $code (attempt $attempt of 18), retrying in 10 s"
              sleep 10
            done
            echo "https://jithendar.com/$path -> $code"
            [[ "$code" =~ ^(200|302|401|403)$ ]] || { echo "::error::/$path answered $code for 3 minutes"; exit 1; }
          done

      # The plan and the kubeconfig hold credentials; do not leave them on the runner.
      - name: remove plan and kubeconfig
        if: always()
        run: rm -f minikube-infrastructure/tf.tfplan "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/plan.txt"
