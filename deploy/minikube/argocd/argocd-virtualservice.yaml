# /argocd on the Istio gateway: a delegate of the jithendar.com routing table (deploy/minikube/istio/edge). Argo CD
# serves under /argocd itself (values.yaml: server.rootpath, server.basehref) in plain HTTP (server.insecure); the
# gateway terminates TLS. HTTP to HTTPS is the Gateway's own redirect.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: argocd
spec:
  http:
  - name: argocd
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local
        port: {number: 80}
