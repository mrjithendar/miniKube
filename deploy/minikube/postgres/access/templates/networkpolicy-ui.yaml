# Namespace {{ .Release.Namespace }} has no Istio sidecars (CloudNativePG manages its own pods and TLS), so the gateway
# talks to these pods in plain text inside the cluster.
# Adminer: only the gateway may reach it, and it may reach only DNS and this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ui
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres-ui
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}
          podSelector:
            matchLabels: {{ toYaml .Values.gatewaySelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster }}
      ports:
        - port: 5432
          protocol: TCP
