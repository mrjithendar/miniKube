# Dependabot version updates for the mk4 manifests, local charts, Terraform providers and workflows.
# Merging is a deploy: Argo CD auto-syncs deploy/minikube (selfHeal), and create-mk-infrastructure.yml applies
# minikube-infrastructure/ (which installs the local observability charts) on pushes to master.
#
# Minor and patch updates are grouped to keep the PR count down; majors arrive one PR each.
# Security updates are not grouped and are not held back by the cooldown.
#
# Stateful images (postgres, valkey) restart their StatefulSet when merged. mk4's hostpath PVs have no
# nodeAffinity, so a pod that lands on another node starts on an empty volume: check the node before merging.
#
# Not covered, because Dependabot cannot read them; bump these by hand: Helm chart versions in
# deploy/minikube/applications/*.yaml and the helm_release blocks in minikube-infrastructure/*.tf, scripts/argocd/ and
# deploy/minikube/deploy-*.sh, terraform_version in the workflows, the Harbor images (custom tags in
# deploy/minikube/harbor/values.yaml, built by build-harbor-images.yml), and the Vault image
# (deploy/minikube/vault/values.yaml has no Chart.yaml, and tests/test_vault_chart.py pins it).
# Host tool versions are in the tools repository (scripts/setup/versions.json).

version: 2

updates:
  # Plain Kubernetes manifests (Dependabot reads image: lines in each directory, not its subdirectories)
  - package-ecosystem: docker
    directories:
      - /deploy/minikube/ecr-refresh
      - /deploy/minikube/harbor/manifests
      - /deploy/minikube/harbor/examples
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(k8s)"
    groups:
      images-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major PostgreSQL upgrades need pg_upgrade or a dump/restore of the data volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Harbor's cache: take a Valkey major deliberately, not in a routine bump.
      - dependency-name: valkey/valkey
        update-types: ["version-update:semver-major"]
      # The ECR refresh job already runs the newest Python (3.15); move minors by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Local charts installed by minikube-infrastructure/ (images in each chart's values.yaml). The image strings live in
  # values.yaml rather than templates/ because Dependabot cannot parse templated YAML.
  - package-ecosystem: helm
    directories:
      - /deploy/minikube/observability/prometheus
      - /deploy/minikube/observability/loki
      - /deploy/minikube/observability/jaeger
      - /deploy/minikube/observability/otel-collector
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(helm)"
    groups:
      helm-minor-patch:
        update-types: [minor, patch]

  # Providers (helm, kubernetes, random) in minikube-infrastructure/ + .terraform.lock.hcl. Not the chart versions.
  - package-ecosystem: terraform
    directory: /minikube-infrastructure
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(terraform)"
    groups:
      providers-minor-patch:
        update-types: [minor, patch]

  # Actions in .github/workflows (pinned by commit SHA; Dependabot updates the SHA and the comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
