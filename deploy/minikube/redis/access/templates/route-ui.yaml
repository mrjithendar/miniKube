# {{ .Values.ui.prefix }}: a delegate of the root VirtualService (edge chart, route "redis"): no hosts or gateways of its
# own. The allowlist (allowlist-ui.yaml) and the gateway login (edge chart basicAuth "redis") run before any route.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: redis-ui
  namespace: {{ .Release.Namespace }}
spec:
  http:
    # /redis → /redis/ (RedisInsight's assets are relative to the folder).
    - name: redis-slash
      match:
        - uri:
            exact: {{ .Values.ui.prefix }}
      redirect:
        uri: {{ printf "%s/" .Values.ui.prefix }}
        redirectCode: 302
    # With RI_PROXY_PATH set, the frontend opens its socket at {{ .Values.ui.prefix }}/socket.io, but the backend serves
    # socket.io at the root only; unrewritten, the request falls through to the SPA and gets index.html back.
    - name: redis-ui-socket
      match:
        - uri:
            prefix: {{ printf "%s/socket.io" .Values.ui.prefix }}
      rewrite:
        uri: /socket.io
      route:
        - destination:
            host: {{ printf "redis-ui.%s.svc.cluster.local" .Release.Namespace }}
            port:
              number: 80
    - name: redis-ui
      match:
        - uri:
            prefix: {{ printf "%s/" .Values.ui.prefix }}
      headers:
        response:
          set:
            X-Robots-Tag: noindex, nofollow
            Cache-Control: no-store
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
      route:
        - destination:
            host: {{ printf "redis-ui.%s.svc.cluster.local" .Release.Namespace }}
            port:
              number: 80
