# Values for istio-release istiod 1.30.7 (minikube-infrastructure/istio.tf). Same mesh settings as EKS
# (tools repository: deploy/eks/helm-values/istiod.yaml). One replica: moks and jithendar are labelled istio-injection=enabled,
# so while istiod restarts, new pods there wait for the fail-closed injection webhook.
pilot:
  autoscaleEnabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Redirection comes from the istio-cni agent (minikube-infrastructure/istio.tf), not an istio-init container.
  cni:
    enabled: true
  env:
    # The proxy starts before and stops after the application, including for init containers and Jobs.
    ENABLE_NATIVE_SIDECARS: "true"
sidecarInjectorWebhook:
  # jithendar.com practice sandboxes: their ValidatingAdmissionPolicy forbids init containers, and a sidecar would
  # give gVisor pods a network path. Backs up the pods' own sidecar.istio.io/inject=false label.
  neverInjectSelector:
    - matchExpressions:
        - {key: app.kubernetes.io/name, operator: In, values: [practice-sandbox]}
global:
  proxy:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
meshConfig:
  # Mesh retries could replay a checkout or payment; the applications own idempotency.
  defaultHttpRetryPolicy:
    attempts: 0
  defaultConfig:
    holdApplicationUntilProxyStarts: true
