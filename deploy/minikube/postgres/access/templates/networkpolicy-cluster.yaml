# Namespace {{ .Release.Namespace }} has no Istio sidecars (CloudNativePG manages its own pods and TLS), so the gateway
# talks to these pods in plain text inside the cluster.
#
# Instances: PostgreSQL from any namespace (applications) and the gateway's TCP route; the instance manager's status
# port from the operator; the exporter from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.cluster }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster }}
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
          protocol: TCP
