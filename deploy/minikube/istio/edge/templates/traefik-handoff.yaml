{{- with .Values.traefikHandoff }}
{{- if .enabled }}
{{- $match := list }}
{{- range .hosts }}{{ $match = append $match (printf "Host(`%s`)" .) }}{{ end }}
# Temporary: Traefik still receives every connection from the host's HAProxy. Delete with traefikHandoff.enabled=false
# once the HAProxy sends these hosts to the gateway directly (values.yaml, step 3).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: istio-ingressgateway
  namespace: {{ $.Release.Namespace | quote }}
spec:
  serverName: {{ .serverName | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: istio-handoff-https
  namespace: {{ $.Release.Namespace | quote }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: {{ join " || " $match | quote }}
      # Lowest priority: Ingresses for other paths on these hosts and cert-manager's HTTP-01 solvers keep precedence.
      priority: 1
      services:
        - name: istio-ingressgateway
          port: 443
          scheme: https
          serversTransport: istio-ingressgateway
  # Traefik's default certificate (TLSStore default, jithendar.com repo), which covers these hosts.
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: istio-handoff-http
  namespace: {{ $.Release.Namespace | quote }}
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: {{ join " || " $match | quote }}
      priority: 1
      services:
        - name: istio-ingressgateway
          port: 80
{{- end }}
{{- end }}
