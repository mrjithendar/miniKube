{{- with .Values.gateway }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .certificate.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  secretName: {{ .certificate.secretName | quote }}
  dnsNames: {{ toYaml .certificate.dnsNames | nindent 4 }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .certificate.issuer | quote }}
{{- end }}
