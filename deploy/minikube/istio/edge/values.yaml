# Installed by minikube-infrastructure/istio.tf (release istio-edge, namespace istio-ingress): mk4's public edge.
# The host's HAProxy (deploy/minikube/expose-ingress.sh) forwards 80/443 to the gateway's NodePorts 31080/31443 with
# a PROXY protocol v2 header. Everything here lives in the gateway's namespace: a Gateway's credentialName Secret must
# be in the namespace of the gateway pods.
#
# Who owns what:
#   - this chart: the Gateway, its certificate, the routing table for jithendar.com (which path prefix belongs to
#     which application), redirects, logins (basic auth) and gateway-wide behaviour (compression, client addresses);
#   - each application: a delegate VirtualService in its own namespace (no hosts, no gateways) for its prefix, or a
#     VirtualService of its own for its own hostname (registry., jfrog., db.).
selector:
  istio: ingressgateway

gateway:
  name: public
  # One certificate for every hostname (DNS-01 through Cloudflare, so renewals need no HTTP route).
  certificate:
    name: jithendar-com
    secretName: jithendar-com-gateway-tls
    issuer: letsencrypt-dns
    dnsNames: [jithendar.com, "*.jithendar.com"]
  # HTTPS hosts as namespace/hostname: only VirtualServices in that namespace may bind them. jithendar.com and www
  # are bound by the root VirtualService below; applications reach them through delegation.
  https:
    - istio-ingress/jithendar.com
    - istio-ingress/www.jithendar.com
    - harbor/registry.jithendar.com
    - jfrog/jfrog.jithendar.com
  # TLS terminated here, then plain TCP (VirtualService tcp routes): PostgreSQL at db.jithendar.com:443 (the site's
  # database) and postgres.jithendar.com:443 (the CloudNativePG cluster, deploy/minikube/postgres/access).
  tls:
    - host: jithendar/db.jithendar.com
      # libpq 17+ with sslnegotiation=direct requires the server to select ALPN "postgresql".
      alpn: [postgresql]
    - host: postgres-db/postgres.jithendar.com
      alpn: [postgresql]

# The routing table for jithendar.com. First match wins, so a prefix that begins with another one comes first
# (/opensearch-dashboards before /opensearch). A delegate that does not exist (an application not installed) drops
# its route, and the request falls through to the site, which answers 404.
root:
  host: jithendar.com
  # Redirected to host, path and query kept (308).
  aliases: [www.jithendar.com]
  redirects:
    # Harbor cannot be served under a path prefix: its portal lives on its own hostname.
    - {name: harbor, prefix: /harbor, authority: registry.jithendar.com}
    - {name: jfrog, prefix: /jfrog, authority: jfrog.jithendar.com, uri: /ui/}
    - {name: vault, prefix: /vault, uri: /ui/}
  delegates:
    - {name: argocd, prefix: /argocd, to: argocd/argocd}
    - {name: kiali, prefix: /kiali, to: istio-system/kiali}
    - {name: grafana, prefix: /grafana, to: monitoring/grafana}
    - {name: prometheus, prefix: /prometheus, to: monitoring/prometheus}
    - {name: loki, prefix: /loki, to: monitoring/loki}
    - {name: moks, prefix: /moks, to: moks/moks}
    - {name: opensearch-dashboards, prefix: /opensearch-dashboards, to: moks/moks-opensearch-dashboards}
    - {name: opensearch, prefix: /opensearch, to: moks/moks-opensearch}
    - {name: roboshop, prefix: /roboshop, to: roboshop-ai/roboshop}
    - {name: db, prefix: /db, to: jithendar/jithendar-db-ui}
    - {name: postgres, prefix: /postgres, to: postgres-db/postgres-ui}
    - {name: vault-ui, prefix: /ui, to: vault/vault}
    - {name: vault-api, prefix: /v1, to: vault/vault}
  # Everything else.
  default: jithendar/jithendar-com-site

# Logins on the gateway (Envoy basic_auth, HTTPS listener only), one per entry, decided by path prefix before any
# route, so a protected path never depends on route names. A request whose path starts with `prefix` and not with
# `except` must carry that entry's login. Every `except` is itself covered by another entry's prefix.
# The users (htpasswd lines, {SHA} only) come from the Secret istio-ingress/gateway-basic-auth, which
# scripts/istio/gateway-basic-auth.py builds from each application's own login Secret (`from`); Terraform passes
# them in as basicAuthUsers. A login whose source Secret is missing gets a line nobody can match: locked, not open.
basicAuth:
  - {name: prometheus-remote-write, prefix: /prometheus/api/v1/write, from: monitoring/prometheus-remote-write-auth}
  - {name: prometheus, prefix: /prometheus, except: /prometheus/api/v1/write, from: monitoring/monitoring-auth}
  - {name: loki-push, prefix: /loki/api/v1/push, from: monitoring/loki-push-auth}
  - {name: loki-read, prefix: /loki, except: /loki/api/v1/push, from: monitoring/loki-read-auth}
  - {name: opensearch-dashboards, prefix: /opensearch-dashboards, from: moks/moks-opensearch-dashboards-auth}
  - {name: opensearch, prefix: /opensearch, except: /opensearch-dashboards, from: moks/moks-opensearch-auth}
# Set by Terraform from that Secret: {<name>: "<user>:{SHA}<base64 sha1>"}. Rendering fails if one is missing.
basicAuthUsers: {}

# The bundled OpenSearch pod (moks) has no security of its own and POST/PUT change data, so /opensearch is read-only
# from outside: GET and HEAD, plus POST to the search endpoints, which take their query in the body.
readOnly:
  - prefix: /opensearch
    except: /opensearch-dashboards
    postSuffixes: [/_search, /_msearch, /_count]

# Every route on the gateway.
compression:
  enabled: true
  minContentLength: 1024
  contentTypes:
    - text/html
    - text/css
    - text/plain
    - text/xml
    - text/javascript
    - application/javascript
    - application/json
    - application/xml
    - application/rss+xml
    - application/manifest+json
    - image/svg+xml

# The PROXY protocol header from the host's HAProxy carries the visitor's address. Required: a connection without it
# is refused, so nobody inside the cluster or on the host can reach the edge with an address of their choosing.
proxyProtocol:
  requireHeader: true

# Never sent to visitors (templates/response-headers.yaml).
removeResponseHeaders: [x-envoy-upstream-service-time]

# Applications read the first X-Forwarded-For entry. The gateway replaces whatever a client sent with the address it
# saw itself (the PROXY protocol's), so nobody can choose theirs.
overwriteForwardedFor: true

# Delegates for add-ons whose upstream charts render only an Ingress (turned off in their values): rendered here, in
# the add-on's namespace (templates/route-*.yaml). Applications and local charts keep their own (moks, roboshop-ai, jithendar.com, Prometheus,
# Loki, Argo CD, Harbor, Vault, JFrog).
addonRoutes:
  kiali: {namespace: istio-system, host: kiali, port: 20001}
  grafana: {namespace: monitoring, host: grafana, port: 80}
