# Values for istio-release gateway 1.30.7 (minikube-infrastructure/istio.tf): the Istio ingress gateway on mk4.
# Release name istio-ingressgateway gives the pods the label istio=ingressgateway, the selector Gateway resources use.
# mk4's public edge. The host's HAProxy (../expose-ingress.sh) forwards 80/443 to the NodePorts 31080/31443 with a
# PROXY protocol header, which the gateway reads (edge/, EnvoyFilter proxy-protocol); routing, logins and the
# certificate are in edge/ and in the applications' VirtualServices.
service:
  # Minikube has no load balancer: a LoadBalancer Service would stay <pending> and helm --wait would time out.
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 31443
# No gatewayTopology.numTrustedProxies: nothing in front sets X-Forwarded-For any more (HAProxy forwards TCP), and the
# client address comes from the PROXY protocol. Trusting a hop would let visitors choose their own address.
# Two replicas on different nodes and a PodDisruptionBudget: the gateway is mk4's only way in, so a node drain or a
# rollout must never take the last one. No HPA: small cluster, and metrics-server load should not decide gateway count.
autoscaling:
  enabled: false
replicaCount: 2
podDisruptionBudget:
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {istio: ingressgateway}
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
