
# Create:  hetzner-k3s create --config hetzner-k3s.yaml
# Delete:  hetzner-k3s delete --config hetzner-k3s.yaml
# export KUBECONFIG=$PWD/kubeconfig-hetzner && kubectl get nodes

cluster_name: jithendar
kubeconfig_path: "./kubeconfig-hetzner"
k3s_version: v1.37.2+k3s1
config_format_version: 1

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.ssh/hetzner_k3s.pub"
    private_key_path: "~/.ssh/hetzner_k3s"
  allowed_networks:
    ssh:
      - 0.0.0.0/0   # tighten to your own IP, e.g. 203.0.113.4/32
    api:
      - 0.0.0.0/0   # tighten to your own IP
  public_network:
    ipv4: true
    ipv6: true
  private_network:
    enabled: true
    subnet: 10.0.0.0/16
  cni:
    enabled: true
    encryption: false
    mode: flannel

# All nodes in one EU location: 20 TB traffic included; Arm (CAX) is the cheapest line.
masters_pool:
  instance_type: cax11
  instance_count: 1      # single master keeps cost down (no HA, no API load balancer)
  locations:
    - fsn1

worker_node_pools:
  - name: workers
    instance_type: cax21
    instance_count: 3
    location: fsn1
    # autoscaling:          # enable later if needed; watch the budget
    #   enabled: true
    #   min_instances: 2
    #   max_instances: 3

addons:
  cluster_autoscaler:
    enabled: false   # no autoscaled pools; re-enable together with worker autoscaling

protect_against_deletion: true
create_load_balancer_for_the_kubernetes_api: false
