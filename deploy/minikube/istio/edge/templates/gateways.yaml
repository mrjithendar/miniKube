{{- range .Values.gateways }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  secretName: {{ .certificate.secretName | quote }}
  dnsNames: {{ toYaml .certificate.dnsNames | nindent 4 }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .certificate.issuer | quote }}
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  selector: {{ toYaml $.Values.selector | nindent 4 }}
  servers:
    - port:
        number: 443
        name: {{ printf "https-%s" .name | quote }}
        protocol: HTTPS
      hosts: {{ toYaml .hosts | nindent 8 }}
      tls:
        mode: SIMPLE
        credentialName: {{ .certificate.secretName | quote }}
        minProtocolVersion: TLSV1_2
    # Plain HTTP is bound too, so the VirtualService decides the redirect (one hop for http://www, 308 like before).
    - port:
        number: 80
        name: {{ printf "http-%s" .name | quote }}
        protocol: HTTP
      hosts: {{ toYaml .hosts | nindent 8 }}
{{- end }}
