# Second layer under the AuthorizationPolicies (authorization.yaml), on the pod network. Port 15090 (sidecar metrics)
# from Prometheus and 15008 (HBONE) are admitted too; kubelet probes are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {{- include "redis.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}
        {{- range .Values.clientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 6380, protocol: TCP}
        - {port: 26379, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 9121, protocol: TCP}
        - {port: 15090, protocol: TCP}
