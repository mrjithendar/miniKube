# Image references only, kept here (not in templates/) so Dependabot's helm updater can bump them.
# Loki and Alloy configuration stays in loki.yaml and config.alloy.
loki:
  image: grafana/loki:3.7.9
alloy:
  image: grafana/alloy:v1.21.2
# init container that fixes data-volume ownership
volumePermissions:
  image: busybox:1.37.0
